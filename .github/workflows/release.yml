name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The tag must match the crate version so a stale tag cannot publish a
      # mismatched release.
      - name: Verify tag matches crate version
        run: |
          crate_version="v$(cargo metadata --no-deps --format-version 1 | python3 -c \
            "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")"
          if [ "${GITHUB_REF_NAME}" != "${crate_version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match crate version ${crate_version}"
            exit 1
          fi

      # The token needs publish-new (first publish) and publish-update
      # (later versions); scope it to the umpire-core crate pattern.
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
